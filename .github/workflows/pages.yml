name: Deploy Fish AI journal to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v7
        with:
          repository: khkt-tn/khkt-tn.github.io
          path: khkt-tn.github.io

      - name: Checkout scientific source
        uses: actions/checkout@v7
        with:
          repository: khkt-tn/fish
          path: fish

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: khkt-tn.github.io/requirements.txt

      - name: Install dependencies
        working-directory: khkt-tn.github.io
        run: pip install -r requirements.txt

      - name: Synchronize research diary
        working-directory: khkt-tn.github.io
        run: python scripts/sync_research_diary.py

      - name: Rebuild journal index
        working-directory: khkt-tn.github.io
        run: python scripts/build_journal_index.py

      - name: Validate synchronized content
        working-directory: khkt-tn.github.io
        run: python scripts/validate_site.py --skip-source-check

      - name: Build MkDocs
        working-directory: khkt-tn.github.io
        run: mkdocs build --strict

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: khkt-tn.github.io/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
